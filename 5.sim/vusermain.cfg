# CPU=iss: the rv32 ISS on the EP firmware, with eduBOS5 2-stage timing.
# Loads and stores in 0x30000000-0x3FFFFFFF (the CSR bridge) go out on the
# SOC bus as VProc cycles; the ISS keeps code and data in its own memory.
vusermain0 -V EDUBOS5STG2 -H -x 0x30000000 -X 0x3FFFFFFF -t ../4.build/sw_build/firmware.elf
