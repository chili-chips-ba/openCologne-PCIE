#
# RTL lint gate: 4.build/hw_build/run-lint.sh on top, chip and simulation
# views; phases tags, verilator, yosys and slang. The verible phase is gated
# in verible.yml. Tools come from the OSS CAD Suite (Yosys with the
# yosys-slang plugin, Verilator); the project's own runs use the versions in
# 4.build/README.md (Tool versions).

name: lint

on:
  push:
  pull_request:

jobs:
  run-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Cologne Chip MAC, DLL, PIPE (2.rtl/2.pipe/pipe_src)

      - name: Install OSS CAD Suite (Yosys + yosys-slang, Verilator)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Tool versions
        run: |
          yosys -V
          verilator --version

      - name: run-lint (chip view)
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/chip
        run: bash 4.build/hw_build/run-lint.sh tags verilator yosys slang

      - name: run-lint (simulation view)
        if: always()
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/sim
          VIEW: sim
        run: bash 4.build/hw_build/run-lint.sh tags verilator yosys slang

      - name: Keep the lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: ${{ runner.temp }}/lint
