# SPDX-License-Identifier: BSD-3-Clause

# When several annotations match a file, the LAST one in this file wins.
# Order: project-wide defaults first, then third-party exceptions.
#
#   precedence = "closest"  -> a file's own SPDX header wins; this is the fallback
#   precedence = "override" -> this annotation applies even if the file says otherwise
#
# Cologne Chip's PIPE and MAC/LTSSM come in as a git submodule
# (2.rtl/2.pipe/pipe_src), an independent repository
# under their own terms; REUSE does not cover submodules.

version = 1

# =============================================================================
# 1. Project defaults (CHILI.CHIPS.LLC)
# =============================================================================

# Everything not listed below: RTL (DLL included), firmware, build/sim scripts,
# docs, images.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# Hardware notes. The boards themselves (ULX5M M.2 card, ULX4M edge card) are
# designed by Intergalaktik with Radiona.org,
# https://github.com/intergalaktik/ulx5m-m2; their
# pictures are in section 3.
[[annotations]]
path = ["1.pcb/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# PHY testbench: its PIPE test is merged from gatemate-pipe's
# tb_ccfpga_serdes.v and testcase_pipe.v (authors in the file header).
[[annotations]]
path = ["2.rtl/1.phy/3.sim/tb_phy.sv"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 CHILI.CHIPS.LLC", "Cologne Chip AG and RacyICs GmbH (original PIPE testbench)"]
SPDX-License-Identifier = "BSD-3-Clause"

# =============================================================================
# 2. Third-party code (redistributable under its own license)
# =============================================================================

# wyvernSemi co-simulation VIP: VProc, mem_model, pcieVHost, rv32 ISS.
# Our own integration files carry their own BSD header, which wins
# (precedence "closest").
[[annotations]]
path = ["5.sim/vip/**", "5.sim/models/cosim/**", "5.sim/models/pcievhost/**", "5.sim/models/rv32/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2004-2025 Simon Southwell"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ... except our index of those copies
[[annotations]]
path = ["5.sim/vip/README.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# PeakRDL-html viewer, generated by "make -f MakefileCSR". The template, scripts
# and styles are PeakRDL-html's; the register content is ours.
[[annotations]]
path = ["4.build/csr_build/generated-files/html/**"]
precedence = "override"
SPDX-FileCopyrightText = "PeakRDL-html contributors"
SPDX-License-Identifier = "LGPL-3.0-only"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/content/**", "4.build/csr_build/generated-files/html/data/**", "4.build/csr_build/generated-files/html/search/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/css/theme.css"]
precedence = "override"
SPDX-FileCopyrightText = ["PeakRDL-html contributors", "Fonticons, Inc."]
SPDX-License-Identifier = "LGPL-3.0-only AND MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/css/normalize.css"]
precedence = "override"
SPDX-FileCopyrightText = "Nicolas Gallagher and Jonathan Neal"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/js/progressbar.min.js"]
precedence = "override"
SPDX-FileCopyrightText = "Kimmo Brunfeldt"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/FontAwesome/**"]
precedence = "override"
SPDX-FileCopyrightText = "Fonticons, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/Lato/**"]
precedence = "override"
SPDX-FileCopyrightText = "Lukasz Dziedzic"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/RobotoSlab/**"]
precedence = "override"
SPDX-FileCopyrightText = "Google Inc."
SPDX-License-Identifier = "Apache-2.0"

